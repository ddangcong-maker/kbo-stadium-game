<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KBO Stadium Social</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9c2cb;font-family:system-ui,-apple-system,sans-serif}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}#brand,#floors,#bottom,#chat{pointer-events:auto}#brand{background:#fffffff0;border-radius:13px;padding:9px 12px;font-size:12px;color:#233844;box-shadow:0 2px 10px #1232}#brand b{font-size:13px}#daynight{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:8px;background:#eaf2f5;color:#29485b;font-weight:700;font-size:11px}#brand small{display:block;color:#61727a;margin-top:3px}#channel{margin-top:6px;border:1px solid #d3dcdf;border-radius:8px;padding:5px 7px;background:white;color:#263d49;font-size:11px;max-width:155px}#floors{display:flex;gap:5px}button{border:0;border-radius:11px;background:#fff;color:#263d49;padding:10px 13px;font-weight:700;box-shadow:0 2px 8px #1233;font-size:13px;min-height:42px}button.active{background:#233f51;color:white}#bottom{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:center;gap:7px;z-index:5;flex-wrap:wrap}#bottom button{background:#fffffff0}#status{position:fixed;bottom:66px;right:12px;background:#ffffffdf;border-radius:9px;padding:7px 10px;font-size:11px;color:#344955;z-index:4}#chat{position:fixed;left:10px;bottom:66px;width:min(245px,64vw);z-index:4;background:#ffffffe8;border-radius:12px;padding:8px;font-size:11px;color:#263d49}#log{height:37px;overflow:hidden;white-space:pre-line}#row{display:flex;gap:5px}#row input{width:0;min-width:0;flex:1;border:1px solid #cad4d7;border-radius:8px;padding:7px;font-size:12px}#row button{min-height:32px;padding:6px 9px}#hint{position:fixed;top:68px;left:12px;background:#183447b8;color:white;padding:6px 9px;border-radius:8px;font-size:11px;z-index:3;pointer-events:none}@media(min-width:700px){#chat{width:260px}#bottom{bottom:18px}}
</style></head><body><div id="game"></div><div id="top"><div id="brand"><b>KBO STADIUM SOCIAL</b><small id="who">야구장에 입장하는 중…</small><span id="daynight">☀️ 낮 · 07:00–19:00</span><select id="channel" aria-label="채널 선택"><option>채널 연결 중…</option></select></div><div id="floors"><button id="f1" class="active">1층</button><button id="f3">3층</button></div></div><div id="hint">가고 싶은 바닥을 터치 · 화면을 드래그해 둘러보기</div><div id="chat"><div id="log">채팅에 오신 걸 환영해요.</div><div id="row"><input id="msg" maxlength="100" placeholder="메시지 입력"><button id="send">전송</button></div></div><div id="status">서버 연결 중…</div><div id="bottom"><button id="sit">앉기</button><button id="cheer">응원하기</button><button id="food">음식 들기</button><button id="stop">동작 해제</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';import{io}from'https://cdn.socket.io/4.8.1/socket.io.esm.min.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();const daySky=new THREE.Color(0xaec5cf),nightSky=new THREE.Color(0x101d35);scene.background=daySky.clone();scene.fog=new THREE.Fog(daySky.clone(),65,145);const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);const hemi=new THREE.HemisphereLight(0xffffff,0x687768,2.0);scene.add(hemi);const sun=new THREE.DirectionalLight(0xfff4df,2.1);sun.position.set(-35,55,25);sun.castShadow=true;scene.add(sun);const nightFill=new THREE.AmbientLight(0x829ac7,0);scene.add(nightFill);const dayNightLabel=document.querySelector('#daynight');const dawnSky=new THREE.Color(0xaec5cf),duskSky=new THREE.Color(0x101d35);let nightBlend=0;function getKoreaMinutes(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const h=Number(parts.find(v=>v.type==='hour').value),m=Number(parts.find(v=>v.type==='minute').value);return h*60+m}function updateDayNight(){const mins=getKoreaMinutes();const night=mins>=19*60||mins<7*60;const label=night?'🌙 밤 · 19:00–07:00':'☀️ 낮 · 07:00–19:00';if(dayNightLabel)dayNightLabel.textContent=label;let target=night?1:0;const fade=20; if(mins>=19*60-fade&&mins<19*60+fade)target=(mins-(19*60-fade))/(fade*2);else if(mins>=7*60-fade&&mins<7*60+fade)target=1-(mins-(7*60-fade))/(fade*2);nightBlend=THREE.MathUtils.clamp(target,0,1);scene.background.copy(daySky).lerp(nightSky,nightBlend);scene.fog.color.copy(scene.background);hemi.intensity=2.0-(1.15*nightBlend);sun.intensity=2.1-(1.65*nightBlend);sun.color.set(0xfff4df).lerp(new THREE.Color(0x9bb8ff),nightBlend);nightFill.intensity=.0+.48*nightBlend;sun.position.set(-35,55,25)}updateDayNight();setInterval(updateDayNight,15000);
const M=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const white=M(0xffffff);const grass=M(0x438b58),grass2=M(0x559866),dirt=M(0xb98c60),concrete=M(0xc8c9c2),seatM=[M(0x315d78),M(0x3d6f89),M(0x45677c)],navy=M(0x203b50),cream=M(0xf5f0e5),orange=M(0xe97828),skin=M(0xf0c49d),dark=M(0x26343b),gold=M(0xe6bd63);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
// Large oval field and baseball diamond
box(150,.6,130,M(0x71828a),0,-.65,0);const field=new THREE.Mesh(new THREE.CircleGeometry(30,96),grass);field.scale.set(1.35,.92,1);field.rotation.x=-Math.PI/2;field.position.set(0,-.25,-2);scene.add(field);for(let i=0;i<12;i++){const a=i*Math.PI/6;const patch=new THREE.Mesh(new THREE.PlaneGeometry(10,50),i%2?grass:grass2);patch.rotation.x=-Math.PI/2;patch.rotation.z=a;patch.position.set(0,-.235,-2);scene.add(patch)}
const diamond=new THREE.Mesh(new THREE.PlaneGeometry(25,25),dirt);diamond.rotation.x=-Math.PI/2;diamond.rotation.z=Math.PI/4;diamond.position.set(0,-.18,-2);scene.add(diamond);const mound=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,.4,32),dirt);mound.position.set(0,.05,-2);scene.add(mound);for(const [x,z]of[[0,10.5],[10.5,0],[0,-12.5],[-10.5,0]]){const b=box(1,.16,1,cream,x,.05,z-2);b.rotation.y=Math.PI/4}
// continuous oval bowl: 3 full elliptical seating rings with stepped rows
function ovalRing(rx,rz,y,thick,material){const pts=[];for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;pts.push(new THREE.Vector3(rx*Math.cos(a),y,rz*Math.sin(a)))}const curve=new THREE.CatmullRomCurve3(pts);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,320,thick,5,true),material);mesh.receiveShadow=true;scene.add(mesh)}
for(let tier=0;tier<3;tier++){const baseX=37+tier*6,baseZ=28+tier*5,baseY=1.0+tier*3.05;for(let row=0;row<7;row++){const rx=baseX+row*.95,rz=baseZ+row*.85,y=baseY+row*.31;ovalRing(rx,rz,y,.65,concrete);for(let k=0;k<64;k++){const a=k/64*Math.PI*2;const x=rx*Math.cos(a),z=rz*Math.sin(a);const chair=box(1.25,.55,.85,seatM[tier],x,y+.48,z);chair.rotation.y=-a;}}ovalRing(baseX+7,baseZ+6,baseY+2.2,.8,navy)}
// concourse promenade and third deck balcony, all around oval
ovalRing(54,43,6.7,1.3,concrete);ovalRing(61,49,9.7,1.1,cream);ovalRing(63,51,10.4,.35,navy);
// 1F concourse shops around inner perimeter
const shops=[['치킨',-28,22],['분식',0,34],['피자',28,22],['음료',-35,-17],['스낵',35,-17]];for(const [name,x,z]of shops){box(9,3.6,5,cream,x,1.8,z);box(9,.5,5,orange,x,3.85,z);box(7,1,.16,navy,x,2.45,z-2.58);const sign=box(4,.6,.12,white,x,3.2,z-2.6)}
// Cheerleader stages behind field fence, first and third base sides
for(const x of [-20,20]){box(12,.6,4,navy,x,.65,14);for(let i=0;i<5;i++){const g=new THREE.Group();const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.52,4,8),orange);torso.position.y=.85;g.add(torso);const h=new THREE.Mesh(new THREE.SphereGeometry(.29,12,10),skin);h.position.y=1.55;g.add(h);g.position.set(x-4.4+i*2.2,1,13);scene.add(g)}box(13,1.3,.35,navy,x,1.3,16)}
// Scoreboard and light towers
box(18,7,1.2,navy,0,14,-54);box(16,.18,.15,gold,0,17.1,-53.3);for(const x of [-48,48]){box(.8,19,.8,concrete,x,9,-28);box(8,.5,2,cream,x,19,-28);for(let i=0;i<7;i++)box(.7,.5,.2,white,x-2.5+i*.85,19.5,-28)}
// Ramps joining lower concourse and upper deck (walkable visual connector)
for(const x of [-47,47]){const ramp=box(7,.5,24,concrete,x,4.1,22);ramp.rotation.x=-.22;for(let i=0;i<12;i++)box(7,.12,.18,cream,x,2.4+i*.3,32-i*.85)}
// Avatar builder
function makeAvatar(color=0xe97828){const g=new THREE.Group(),shirt=M(color),pants=M(0x34485b),hair=M(0x4b352a);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.62,4,10),shirt);torso.position.y=1.05;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.39,18,14),skin);head.position.y=1.87;g.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.4,16,10,0,Math.PI*2,0,Math.PI*.53),hair);cap.position.y=2.05;g.add(cap);for(const x of[-.15,.15]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),dark);eye.position.set(x,1.9,-.36);g.add(eye)}for(const x of[-.22,.22]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.5,4,8),pants);leg.position.set(x,.34,0);g.add(leg)}const a=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.5,4,8),skin);a.position.set(-.48,1.1,0);g.add(a);const b=a.clone();b.position.x=.48;g.add(b);g.userData={torso,arm:a,arm2:b};scene.add(g);return g}
const me=makeAvatar(0xe97828);const remotes=new Map();let myId=null,currentChannel=1;const socket=io();const status=document.querySelector('#status'),who=document.querySelector('#who'),channelSelect=document.querySelector('#channel');socket.on('connect',()=>status.textContent='온라인 서버 연결됨');socket.on('disconnect',()=>status.textContent='서버 연결 끊김');function addRemote(p){if(p.id===myId||remotes.has(p.id))return;const g=makeAvatar(teamColor(p.team));g.position.set(p.x,p.floor===3?9:0,p.z);remotes.set(p.id,g)}function clearRemotes(){for(const g of remotes.values())scene.remove(g);remotes.clear()}function updateChannelMenu(counts){channelSelect.innerHTML='';for(let n=1;n<=10;n++){const opt=document.createElement('option');opt.value=n;opt.textContent=`${n}채널 · ${counts?.[String(n)]??0}/100`;channelSelect.appendChild(opt)}channelSelect.value=String(currentChannel)}function teamColor(t){return({Eagles:0xf07824,Tigers:0x9b1d2b,Giants:0x243b70,Bears:0x172d50,Twins:0xb31f35,Lions:0x174f9a,Landers:0xc82c36,Wiz:0x5d263f,Dinos:0x267a69,Heroes:0x7b3b35})[t]||0xefa04b}socket.on('welcome',d=>{myId=d.id;currentChannel=d.channelNumber;d.players.forEach(addRemote);updateChannelMenu(d.counts);who.textContent=`${currentChannel}채널 · ${d.players.length}명 접속`});socket.on('channelCounts',counts=>updateChannelMenu(counts));socket.on('channelChanged',d=>{clearRemotes();currentChannel=d.channelNumber;d.players.forEach(addRemote);updateChannelMenu(d.counts);who.textContent=`${currentChannel}채널 · ${d.players.length+1}명 접속`;status.textContent=`${currentChannel}채널로 이동했어`;me.position.set(0,0,7);floor=1;send()});socket.on('channelError',msg=>{status.textContent=msg;channelSelect.value=String(currentChannel)});channelSelect.addEventListener('change',()=>socket.emit('switchChannel',`stadium-${channelSelect.value}`));socket.on('serverFull',()=>{status.textContent='모든 채널이 가득 찼어.'});socket.on('joined',p=>{addRemote(p);who.textContent='새 관중이 입장했어'});socket.on('updated',p=>{if(p.id!==myId){if(!remotes.has(p.id))addRemote(p);const g=remotes.get(p.id);g.position.set(p.x,p.floor===3?9:0,p.z);g.rotation.y=p.yaw||0}});socket.on('left',id=>{if(remotes.has(id)){scene.remove(remotes.get(id));remotes.delete(id)}});socket.on('chat',d=>{logLine(`${d.name}: ${d.message}`)});
let floor=1,action='walk',yaw=0,pitch=.42,camDist=12,dest=null,drag=null,wasDrag=false;const marker=new THREE.Mesh(new THREE.RingGeometry(.5,.72,32),gold);marker.rotation.x=-Math.PI/2;marker.position.y=.08;marker.visible=false;scene.add(marker);const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let lastSent=0;function send(){if(socket.connected)socket.emit('update',{x:me.position.x,z:me.position.z,floor,yaw,action})}function setFloor(n){floor=n;me.position.y=n===1?0:9;me.position.x=n===1?0:45;me.position.z=n===1?24:22;dest=null;marker.visible=false;document.querySelector('#f1').classList.toggle('active',n===1);document.querySelector('#f3').classList.toggle('active',n===3);send();status.textContent=n+'층 관람석'}document.querySelector('#f1').onclick=()=>setFloor(1);document.querySelector('#f3').onclick=()=>setFloor(3);
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY};wasDrag=false;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.px,dy=e.clientY-drag.py;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8)wasDrag=true;if(wasDrag){yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.05,.95)}drag.px=e.clientX;drag.py=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(!drag)return;if(!wasDrag){const r=renderer.domElement.getBoundingClientRect();ndc.x=(e.clientX-r.left)/r.width*2-1;ndc.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(ndc,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-me.position.y),p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)){// confine to concourse walkable oval, exclude playing field
const radius=Math.sqrt((p.x/1.12)**2+(p.z/0.88)**2);if(radius>31&&radius<64){dest=new THREE.Vector3(p.x,me.position.y,p.z);marker.position.set(p.x,me.position.y+.08,p.z);marker.visible=true;status.textContent='목적지로 이동 중…'}else status.textContent='관중석 통로를 터치해 줘'}}drag=null});renderer.domElement.addEventListener('pointercancel',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>camDist=THREE.MathUtils.clamp(camDist+e.deltaY*.01,7,22));
function teamAction(a){action=a;status.textContent=({sit:'자리에 앉았어',cheer:'응원 중!',food:'음식을 들었어',walk:'이동 가능'})[a];me.userData.torso.position.y=a==='sit'?.65:1.05;send()}document.querySelector('#sit').onclick=()=>teamAction(action==='sit'?'walk':'sit');document.querySelector('#cheer').onclick=()=>teamAction(action==='cheer'?'walk':'cheer');document.querySelector('#food').onclick=()=>teamAction(action==='food'?'walk':'food');document.querySelector('#stop').onclick=()=>teamAction('walk');
const log=document.querySelector('#log');function logLine(line){log.textContent=(log.textContent+'\n'+line).split('\n').slice(-5).join('\n')}function sendChat(){const i=document.querySelector('#msg');if(!i.value.trim())return;socket.emit('chat',i.value);i.value=''}document.querySelector('#send').onclick=sendChat;document.querySelector('#msg').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
function animate(t){requestAnimationFrame(animate);const dt=Math.min(.04,(t-(animate.last||t))/1000);animate.last=t;if(dest&&action==='walk'){const dx=dest.x-me.position.x,dz=dest.z-me.position.z,d=Math.hypot(dx,dz);if(d<.25){dest=null;marker.visible=false;status.textContent='도착했어'}else{const step=Math.min(d,6*dt);me.position.x+=dx/d*step;me.position.z+=dz/d*step;yaw=Math.atan2(dx,dz)}}me.rotation.y=yaw;const cam=new THREE.Vector3(me.position.x+Math.sin(yaw)*camDist*Math.cos(pitch),me.position.y+3.4+Math.sin(pitch)*camDist,me.position.z+Math.cos(yaw)*camDist*Math.cos(pitch));camera.position.lerp(cam,.12);camera.lookAt(me.position.x,me.position.y+1.1,me.position.z);if(t-lastSent>100){send();lastSent=t}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
